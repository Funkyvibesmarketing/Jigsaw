<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Hand pointing finger icon -->
  <g opacity="0.9">
    <!-- Finger body -->
    <rect x="28" y="8" width="10" height="28" rx="5" fill="white"/>
    <!-- Palm -->
    <rect x="16" y="30" width="34" height="22" rx="8" fill="white"/>
    <!-- Knuckle lines -->
    <line x1="24" y1="34" x2="24" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="34" x2="32" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="34" x2="40" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
