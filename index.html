    <style>
      /* Critical CSS for Instant Splash Paint */
      body { margin: 0; background: #ffffff; }
      #splash-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        transition: opacity 0.3s ease;
      }
      .logo-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 392px;
        height: 60px;
        margin-top: -40px;
      }
      @media (min-width: 769px) {
        .logo-container { 
          width: 802px; 
          max-width: none;
          height: 143px; 
          margin-top: 0;
          top: calc(50% - 64.5px);
        }
      }
      .logo-svg { width: 100%; height: 100%; display: block; }
      .letter { opacity: 0; }
      .a-logo { 
        position: absolute; 
        opacity: 0; 
        left: 50%; top: 50%;
        transform: translate(-50%, -50%) scale(0.5);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      
      /* Simple Static Fade-in (No movement) */
      .ready .a-logo { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .ready .letter { opacity: 1; }
    </style>

    <script>
      // Simple fade in shown logo shell
      const shell = document.getElementById('logo-shell');
      setTimeout(() => shell.classList.add('ready'), 50);
      
      // Global cleanup hook for React
      window.__REMOVE_PRELOADER__ = function() {
        const preloader = document.getElementById('splash-preloader');
        if (preloader) {
          preloader.style.opacity = '0';
          setTimeout(() => {
            if (preloader.parentNode) preloader.remove();
          }, 300);
        }
      };
    </script>
